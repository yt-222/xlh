<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- 底：蓝 → 天蓝 -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />

  <!-- 两条轨道，一横一斜，呼应站点的「引力」母题 -->
  <ellipse
    cx="32"
    cy="32"
    rx="21.5"
    ry="8"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.62"
    stroke-width="2"
    transform="rotate(-20 32 32)"
  />
  <ellipse
    cx="32"
    cy="32"
    rx="17"
    ry="13"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.34"
    stroke-width="2"
    transform="rotate(35 32 32)"
  />

  <!-- 核心：阳光黄 -->
  <circle cx="32" cy="32" r="6.4" fill="#fbbf24" />
  <!-- 轨道上的光点 -->
  <circle cx="51.6" cy="24.7" r="2.7" fill="#fbbf24" />
  <circle cx="11.8" cy="39.4" r="2" fill="#ffffff" />
</svg>
