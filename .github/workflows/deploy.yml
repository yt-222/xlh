name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 计算站点地址与路径前缀
        id: path
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "base=/" >> $GITHUB_OUTPUT
            echo "site=https://$OWNER.github.io" >> $GITHUB_OUTPUT
          else
            echo "base=/$REPO" >> $GITHUB_OUTPUT
            echo "site=https://$OWNER.github.io/$REPO" >> $GITHUB_OUTPUT
          fi

      - name: 构建
        run: npm run build
        env:
          BASE_PATH: ${{ steps.path.outputs.base }}
          SITE_URL: ${{ steps.path.outputs.site }}

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
